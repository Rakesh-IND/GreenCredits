version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: green_user
      POSTGRES_PASSWORD: green_password
      POSTGRES_DB: green_credits
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: backend/
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://green_user:green_password@db:5432/green_credits
    env_file:
      - backend/.env
    depends_on:
      - db

  frontend:
    build: frontend/
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
